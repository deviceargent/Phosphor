name: Build Phosphor theme jar

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/build-theme.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download flatlaf.jar (compile-time dependency)
        run: |
          curl -sSL -o flatlaf.jar \
            https://repo1.maven.org/maven2/com/formdev/flatlaf/3.5.4/flatlaf-3.5.4.jar

      - name: Compile Phosphor.java (package-correct source)
        run: |
          mkdir -p bin
          javac -cp flatlaf.jar -d bin \
            src/com/github/deviceargent/phosphor/Phosphor.java
          cp src/com/github/deviceargent/phosphor/Phosphor.properties \
            bin/com/github/deviceargent/phosphor/

      - name: Assemble jar tree from repo layout
        run: |
          mkdir -p jartree/themes/phosphor/org/jdownloader/images
          mkdir -p jartree/cfg/laf
          rsync -a --exclude 'banner/' --exclude 'botty/' --exclude 'fav/' \
            --exclude 'flags/' --exclude 'logo/' --exclude '*.license' \
            images/ jartree/themes/phosphor/org/jdownloader/images/
          cp FlatDarkLaf.json jartree/cfg/laf/

      - name: Package FlatPhosphor.jar
        run: |
          jar cvf FlatPhosphor.jar -C bin . -C jartree .

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlatPhosphor
          path: FlatPhosphor.jar

      - name: Commit built jar back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp FlatPhosphor.jar FlatPhosphor.jar.new
          mv FlatPhosphor.jar.new FlatPhosphor.jar
          git add FlatPhosphor.jar
          git diff --staged --quiet && echo "No changes" || (git commit -m "ci: rebuild FlatPhosphor.jar (package casing fix)" && git push)
